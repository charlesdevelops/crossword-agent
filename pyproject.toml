[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "crossword-agent"
version = "0.1.0"
description = "A provider-neutral, constraint-solving crossword agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.117,<1",
  "langchain-aws>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-nebius>=0.1,<1",
  "langgraph>=0.6,<2",
  "pydantic>=2.11,<3",
  "typer>=0.17,<1",
  "uvicorn>=0.35,<1",
  "wordfreq>=3.1,<4",
]

[project.scripts]
crossword = "crossword_agent.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crossword_agent = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests that make paid cloud model calls"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
