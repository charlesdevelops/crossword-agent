name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --all-groups --locked
      - run: npm ci
      - run: uv run ruff check src tests infra
      - run: uv run pytest
      - run: npm run synth
        env:
          CROSSWORD_AWS_REGION: ap-southeast-2
          JSII_RUNTIME_PACKAGE_CACHE_ROOT: /tmp/jsii-cache
