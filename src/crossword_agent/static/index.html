<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crossword Agent</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #f5f6f1; color: #10243a; }
    main { max-width: 1680px; margin: 0 auto; padding: 20px 24px 28px; }
    header { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; gap: clamp(24px, 4vw, 64px); margin-bottom: 14px; }
    h1 { margin: 0; white-space: nowrap; font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: -.05em; }
    .header-controls { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(190px, .62fr) auto; align-items: center; gap: 12px; width: min(100%, 980px); margin-left: auto; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 30vw, 620px); gap: 16px; align-items: stretch; }
    .panel { background: white; border: 1px solid #dfe3da; border-radius: 8px; padding: 16px; box-shadow: 0 10px 30px #10243a0d; }
    .puzzle-body { display: grid; grid-template-columns: minmax(420px, 1.3fr) minmax(320px, 1fr); gap: 22px; align-items: start; }
    .board-column { min-width: 0; }
    .grid-shell { position: relative; }
    .grid { display: grid; aspect-ratio: 1; border: 3px solid #10243a; background: #10243a; gap: 1px; }
    .cell { position: relative; display: grid; place-items: center; background: white; font-weight: 800; font-size: clamp(1rem, 2.5vw, 2rem); }
    .block { background: #10243a; }
    .number { position: absolute; top: 2px; left: 3px; font-size: clamp(.45rem, 1.1vw, .65rem); font-weight: 700; line-height: 1; }
    .agent-focus { position: absolute; z-index: 2; pointer-events: none; box-sizing: border-box; border: 3px solid #dfff52; box-shadow: 0 0 0 2px #10243a, 0 0 18px #dfff5299; opacity: 0; }
    .agent-focus.active { opacity: 1; }
    .agent-focus.flash { animation: focus-flash .7s ease-out; }
    .agent-focus.pulse { animation: focus-pulse .45s ease-out; }
    @keyframes focus-flash {
      0% { opacity: 0; transform: scale(1.03); }
      18% { opacity: 1; transform: scale(1); }
      72% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes focus-pulse {
      0% { opacity: .35; transform: scale(1.025); }
      100% { opacity: 1; transform: scale(1); }
    }
    button { border: 0; border-radius: 6px; padding: 12px 18px; font-weight: 750; cursor: pointer; }
    button.primary { background: #dfff52; color: #10243a; }
    button.secondary { background: #e9ece4; color: #10243a; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .model-picker { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; gap: 10px; min-width: 0; }
    .model-picker label { color: #6b7784; font-size: .8rem; font-weight: 750; }
    .model-picker select { width: 100%; min-width: 0; border: 1px solid #dfe3da; border-radius: 6px; background: white; color: #10243a; padding: 10px 12px; font: inherit; }
    #benchmarks { flex: 0 0 auto; white-space: nowrap; }
    .actions { display: flex; gap: 8px; margin: 12px 0 0; }
    .status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge { border-radius: 5px; background: #eef1e9; padding: 6px 10px; font-size: .8rem; font-weight: 750; }
    .clues { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .hints { min-width: 0; }
    .detail-tabs { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; border-bottom: 1px solid #dfe3da; }
    .detail-tab { position: relative; border-radius: 0; padding: 0 0 9px; background: transparent; color: #6b7784; font-size: 1.05rem; }
    .detail-tab.active { color: #10243a; }
    .detail-tab.active::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 3px; background: #dfff52; }
    .tab-summary { margin-left: 4px; color: #52704f; font-size: .72rem; }
    .detail-pane[hidden] { display: none; }
    .answer-review { min-width: 0; }
    .review-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .review-heading h3 { margin-bottom: 0; }
    .accuracy { color: #52704f; font-size: .85rem; }
    .answer-grid { display: grid; grid-template-columns: 1fr; gap: 6px; max-height: clamp(360px, calc(100vh - 330px), 620px); overflow-y: auto; padding-right: 4px; scrollbar-gutter: stable; }
    .answer-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid #dfe3da; border-left: 4px solid transparent; border-radius: 6px; }
    .answer-row.correct { border-left-color: #7b9b72; background: #f5faf2; }
    .answer-row.incorrect { border-left-color: #bc554b; background: #fff5f2; }
    .answer-entry { font-weight: 800; }
    .answer-value { min-width: 0; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, monospace; }
    .answer-value::before { content: attr(data-label); display: block; margin-bottom: 2px; color: #6b7784; font: 700 10px/1.2 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    .empty-clues { color: #6b7784; font-style: italic; list-style: none; margin-left: -26px; }
    h2, h3 { margin-top: 0; }
    ol { padding-left: 26px; }
    li { margin-bottom: 6px; }
    .activity-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .live { display: inline-flex; align-items: center; gap: 6px; color: #52704f; font-size: .72rem; font-weight: 800; letter-spacing: .08em; }
    .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #a9c52c; box-shadow: 0 0 0 4px #dfff5240; }
    .activity-panel { position: sticky; top: 20px; }
    .log { height: clamp(420px, calc(100vh - 220px), 720px); overflow-y: auto; overflow-x: hidden; background: #10243a; color: #e9f2f9; border-radius: 6px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; font: 12px/1.65 ui-monospace, monospace; scrollbar-gutter: stable; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .metric { background: #f2f4ee; border-radius: 6px; padding: 8px; }
    .metric strong { display: block; font-size: 1.15rem; }
    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr; }
      .activity-panel { position: static; }
      .log { height: 320px; }
    }
    @media (max-width: 1080px) {
      header { grid-template-columns: 1fr; gap: 14px; }
      .header-controls { width: 100%; max-width: none; margin-left: 0; }
    }
    @media (max-width: 860px) {
      .puzzle-body { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      h1 { white-space: normal; }
      .header-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Crossword Agent</h1>
    <div class="header-controls">
      <div class="model-picker">
        <label for="model">Model</label>
        <select id="model" disabled aria-label="Choose the solving model">
          <option>Loading models…</option>
        </select>
      </div>
      <div class="model-picker">
        <label for="thinking">Thinking</label>
        <select id="thinking" disabled aria-label="Choose reasoning effort">
          <option value="none">None</option>
          <option value="minimal">Minimal</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="xhigh">XHigh</option>
        </select>
      </div>
      <button id="benchmarks" class="secondary" type="button">Benchmark results</button>
    </div>
  </header>
  <div class="layout">
    <section class="panel puzzle-panel">
      <div class="status"><h2 id="title">Loading puzzle…</h2><span id="status" class="badge">IDLE</span></div>
      <div class="puzzle-body">
        <div class="board-column">
          <div id="grid-shell" class="grid-shell">
            <div id="grid" class="grid"></div>
            <div id="agent-focus" class="agent-focus" aria-hidden="true"></div>
          </div>
          <div class="actions">
            <button id="new-puzzle" class="secondary">Choose a new puzzle</button>
            <button id="solve" class="primary">Solve</button>
          </div>
        </div>
        <div class="hints">
          <div class="detail-tabs" role="tablist" aria-label="Puzzle details">
            <button id="hints-tab" class="detail-tab active" role="tab" aria-selected="true" aria-controls="hints-pane">Hints</button>
            <button id="review-tab" class="detail-tab" role="tab" aria-selected="false" aria-controls="answer-review" disabled>
              Review <span id="review-tab-summary" class="tab-summary"></span>
            </button>
          </div>
          <div id="hints-pane" class="detail-pane" role="tabpanel" aria-labelledby="hints-tab">
            <div class="clues">
              <div><h3>Across</h3><ol id="across"></ol></div>
              <div><h3>Down</h3><ol id="down"></ol></div>
            </div>
          </div>
          <section id="answer-review" class="detail-pane answer-review" role="tabpanel" aria-labelledby="review-tab" aria-live="polite" hidden>
            <div class="review-heading">
              <h3>Answer review</h3>
              <strong id="accuracy" class="accuracy"></strong>
            </div>
            <div id="answer-rows" class="answer-grid"></div>
          </section>
        </div>
      </div>
    </section>
    <aside class="panel activity-panel">
      <div class="activity-heading"><h2>Agent activity</h2><span class="live">LIVE</span></div>
      <div id="log" class="log" role="log" aria-live="polite">Waiting for a run.</div>
      <div class="metrics">
        <div class="metric"><span>Calls</span><strong id="calls">0</strong></div>
        <div class="metric"><span>Latency</span><strong id="latency">0s</strong></div>
        <div class="metric"><span>Filled</span><strong id="filled">0</strong></div>
      </div>
    </aside>
  </div>
</main>
<script>
let puzzle = null;
let eventStream = null;
let activeRunStatus = null;
let activeRunId = null;
let answerReviewRequestedFor = null;
let lastEventFingerprint = "";
let activeAgentEntryId = null;
let modelsLoaded = false;
const terminal = new Set(["SOLVED", "STALLED", "FAILED", "BUDGET_EXCEEDED"]);
const turnEndPhases = new Set(["search", "finalize", "worker"]);
const $ = (id) => document.getElementById(id);

function renderGrid(rows) {
  const grid = $("grid");
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = `repeat(${puzzle.width}, 1fr)`;
  const numberMap = new Map();
  puzzle.entries.forEach(entry => {
    const key = `${entry.start[0]}:${entry.start[1]}`;
    const numbers = numberMap.get(key) || [];
    if (!numbers.includes(entry.number)) numbers.push(entry.number);
    numberMap.set(key, numbers);
  });
  rows.forEach((row, rowIndex) => [...row].forEach((char, colIndex) => {
    const cell = document.createElement("div");
    cell.className = char === "#" ? "cell block" : "cell";
    const numbers = numberMap.get(`${rowIndex}:${colIndex}`);
    if (numbers?.length && char !== "#") {
      const label = document.createElement("span");
      label.className = "number";
      label.textContent = numbers.join("/");
      cell.appendChild(label);
    }
    if (char !== "." && char !== "#") {
      const letter = document.createElement("span");
      letter.textContent = char;
      cell.appendChild(letter);
    }
    grid.appendChild(cell);
  }));
}

function renderPuzzle(next) {
  puzzle = next;
  activeRunId = null;
  lastEventFingerprint = "";
  resetAnswerReview();
  clearAgentTarget();
  $("title").textContent = next.title;
  for (const direction of ["across", "down"]) {
    const list = $(direction);
    list.innerHTML = "";
    const entries = next.entries.filter(e => e.direction === direction);
    entries.forEach(entry => {
      const item = document.createElement("li");
      item.value = entry.number;
      item.textContent = `${entry.clue} (${entry.length})`;
      list.appendChild(item);
    });
    if (!entries.length) {
      const item = document.createElement("li");
      item.className = "empty-clues";
      item.textContent = "No hints loaded.";
      list.appendChild(item);
    }
  }
  renderGrid(next.template);
  const valid = next.entries.some(e => e.direction === "across")
    && next.entries.some(e => e.direction === "down");
  $("status").textContent = valid ? "IDLE" : "INVALID";
  $("log").textContent = valid
    ? "Ready to solve."
    : "This puzzle has no usable hints. Re-run the dataset preparation step.";
  $("solve").disabled = !valid;
  $("model").disabled = !modelsLoaded;
  $("thinking").disabled = !modelsLoaded;
  $("thinking").value = "none";
  $("calls").textContent = "0";
  $("latency").textContent = "0s";
  $("filled").textContent = "0";
}

async function loadModels() {
  const response = await fetch("api/models");
  if (!response.ok) throw new Error("Unable to load available models");
  const catalog = await response.json();
  const select = $("model");
  select.replaceChildren(
    ...catalog.models.map(modelId => {
      const option = document.createElement("option");
      option.value = modelId;
      option.textContent = modelId;
      return option;
    })
  );
  select.value = catalog.default;
  modelsLoaded = true;
  select.disabled = false;
  $("thinking").disabled = false;
}

async function choosePuzzle() {
  stopRunStream();
  activeRunId = null;
  const query = puzzle ? `?exclude=${encodeURIComponent(puzzle.id)}` : "";
  const response = await fetch(`api/puzzles/random${query}`);
  if (!response.ok) throw new Error("Unable to load a puzzle");
  renderPuzzle(await response.json());
}

async function solve() {
  if (!puzzle || !puzzle.entries.length) return;
  if (!modelsLoaded || !$("model").value) {
    $("log").textContent = "Models are still loading.";
    return;
  }
  resetAnswerReview();
  clearAgentTarget();
  $("solve").disabled = true; $("new-puzzle").disabled = true;
  $("model").disabled = true; $("thinking").disabled = true;
  const response = await fetch("api/runs", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      puzzle_id: puzzle.id,
      model_id: $("model").value,
      reasoning_effort: $("thinking").value
    })
  });
  if (!response.ok) {
    const body = await response.json();
    $("log").textContent = JSON.stringify(body.detail ?? body);
    $("solve").disabled = false; $("new-puzzle").disabled = false;
    $("model").disabled = false; $("thinking").disabled = false;
    return;
  }
  const run = await response.json();
  streamRun(run.run_id);
}

function streamRun(runId) {
  stopRunStream();
  activeRunId = runId;
  activeRunStatus = "PENDING";
  lastEventFingerprint = "";
  eventStream = new EventSource(`api/runs/${encodeURIComponent(runId)}/stream`);
  eventStream.onmessage = event => {
    try {
      renderRun(JSON.parse(event.data));
    } catch {
      $("log").textContent += "\n[stream] Ignored an invalid update.";
    }
  };
  eventStream.onerror = () => {
    if (!terminal.has(activeRunStatus)) {
      $("status").textContent = "RECONNECTING";
    }
  };
}

function stopRunStream() {
  if (eventStream) {
    eventStream.close();
    eventStream = null;
  }
}

function renderRun(run) {
  activeRunStatus = run.status;
  const assignmentComplete = Object.keys(run.assignment).length === puzzle.entries.length;
  $("status").textContent = run.status === "BUDGET_EXCEEDED" && assignmentComplete
    ? "REVIEW NEEDED"
    : run.status.replaceAll("_", " ");
  renderGrid(run.grid);
  const activity = run.events.map(event => {
    const entry = event.entry_id ? ` ${event.entry_id}` : "";
    return `[${event.phase}${entry}] ${event.message}`;
  }).join("\n") || "Starting…";
  const finalEvent = run.events.at(-1);
  const trace = terminal.has(run.status) && finalEvent?.phase === "finalize"
    ? `\n\n[agent trace]\n${run.events.map((event, index) => {
        const entry = event.entry_id ? ` ${event.entry_id}` : "";
        const details = Object.keys(event.details || {}).length
          ? ` ${JSON.stringify(event.details)}`
          : "";
        return `${String(index + 1).padStart(2, "0")} [${event.phase}${entry}] `
          + `${event.message}${details}`;
      }).join("\n")}`
    : "";
  const log = $("log");
  const error = run.error ? `\n[error] ${run.error}` : "";
  log.textContent = `${activity}${trace}${error}`;
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  const eventFingerprint = JSON.stringify(run.events);
  if (eventFingerprint !== lastEventFingerprint && run.events.length) {
    lastEventFingerprint = eventFingerprint;
    requestAnimationFrame(() => flashAgentTarget(run.events.at(-1)));
  }
  $("calls").textContent = run.metrics.model_calls;
  $("latency").textContent = `${(run.metrics.elapsed_ms / 1000).toFixed(1)}s`;
  $("filled").textContent = Object.keys(run.assignment).length;
  if (terminal.has(run.status)) {
    stopRunStream();
    $("solve").disabled = false; $("new-puzzle").disabled = false;
    $("model").disabled = false; $("thinking").disabled = false;
    loadAnswerReview(run.run_id).catch(error => {
      if (activeRunId !== run.run_id) return;
      $("review-tab").disabled = false;
      $("review-tab-summary").textContent = "!";
      $("accuracy").textContent = "Unavailable";
      $("answer-rows").textContent = error.message;
      showDetailPane("review");
    });
  }
}

function showDetailPane(name) {
  const showReview = name === "review" && !$("review-tab").disabled;
  $("hints-pane").hidden = showReview;
  $("answer-review").hidden = !showReview;
  $("hints-tab").classList.toggle("active", !showReview);
  $("review-tab").classList.toggle("active", showReview);
  $("hints-tab").setAttribute("aria-selected", String(!showReview));
  $("review-tab").setAttribute("aria-selected", String(showReview));
}

function resetAnswerReview() {
  answerReviewRequestedFor = null;
  $("review-tab").disabled = true;
  $("review-tab-summary").textContent = "";
  $("accuracy").textContent = "";
  $("answer-rows").replaceChildren();
  showDetailPane("hints");
}

async function loadAnswerReview(runId) {
  if (answerReviewRequestedFor === runId) return;
  answerReviewRequestedFor = runId;
  const response = await fetch(`api/runs/${encodeURIComponent(runId)}/answers`);
  if (!response.ok) throw new Error("Unable to load answer review.");
  const review = await response.json();
  if (activeRunId !== runId) return;

  const accuracyPercent = Math.round(review.accuracy * 100);
  $("accuracy").textContent =
    `${review.correct_entries}/${review.total_entries} · ${accuracyPercent}%`;
  $("review-tab-summary").textContent = `${accuracyPercent}%`;
  const rows = $("answer-rows");
  rows.replaceChildren();
  review.entries.forEach(entry => {
    const row = document.createElement("div");
    row.className = `answer-row ${entry.correct ? "correct" : "incorrect"}`;

    const label = document.createElement("span");
    label.className = "answer-entry";
    label.textContent = `${entry.entry_id} ${entry.correct ? "✓" : "×"}`;

    const agentAnswer = document.createElement("span");
    agentAnswer.className = "answer-value";
    agentAnswer.dataset.label = "Agent";
    agentAnswer.textContent = entry.agent_answer || "—";

    const correctAnswer = document.createElement("span");
    correctAnswer.className = "answer-value";
    correctAnswer.dataset.label = "Correct";
    correctAnswer.textContent = entry.correct_answer;

    row.append(label, agentAnswer, correctAnswer);
    rows.appendChild(row);
  });
  $("review-tab").disabled = false;
  showDetailPane("review");
}

function flashAgentTarget(event) {
  const outline = $("agent-focus");
  const grid = $("grid");
  const shell = $("grid-shell");
  if (!puzzle || !grid.children.length) return;

  if (!event.entry_id) {
    if (turnEndPhases.has(event.phase)) {
      clearAgentTarget();
      return;
    }
    if (activeAgentEntryId) return;
    Object.assign(outline.style, {
      left: "0px",
      top: "0px",
      width: `${shell.clientWidth}px`,
      height: `${shell.clientHeight}px`
    });
    outline.classList.remove("active", "pulse", "flash");
    void outline.offsetWidth;
    outline.classList.add("flash");
    return;
  }

  const entry = puzzle.entries.find(candidate => candidate.id === event.entry_id);
  if (!entry) return;
  let left = 0;
  let top = 0;
  let width = shell.clientWidth;
  let height = shell.clientHeight;

  const [startRow, startCol] = entry.start;
  const endRow = startRow + (entry.direction === "down" ? entry.length - 1 : 0);
  const endCol = startCol + (entry.direction === "across" ? entry.length - 1 : 0);
  const first = grid.children[startRow * puzzle.width + startCol];
  const last = grid.children[endRow * puzzle.width + endCol];
  if (first && last) {
    const shellRect = shell.getBoundingClientRect();
    const firstRect = first.getBoundingClientRect();
    const lastRect = last.getBoundingClientRect();
    left = firstRect.left - shellRect.left;
    top = firstRect.top - shellRect.top;
    width = lastRect.right - firstRect.left;
    height = lastRect.bottom - firstRect.top;
  }

  activeAgentEntryId = entry.id;
  Object.assign(outline.style, {
    left: `${left}px`,
    top: `${top}px`,
    width: `${width}px`,
    height: `${height}px`
  });
  outline.classList.remove("flash", "pulse");
  outline.classList.add("active");
  void outline.offsetWidth;
  outline.classList.add("pulse");
}

function clearAgentTarget() {
  activeAgentEntryId = null;
  $("agent-focus").classList.remove("active", "pulse", "flash");
}

$("new-puzzle").addEventListener("click", () => choosePuzzle().catch(error => $("log").textContent = error.message));
$("solve").addEventListener("click", solve);
$("benchmarks").addEventListener("click", () => { window.location.href = "benchmarks"; });
$("hints-tab").addEventListener("click", () => showDetailPane("hints"));
$("review-tab").addEventListener("click", () => showDetailPane("review"));
Promise.all([choosePuzzle(), loadModels()])
  .catch(error => $("log").textContent = error.message);
</script>
</body>
</html>
